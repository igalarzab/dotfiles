# Run by ./install links on macOS only.
- plugins:
    - dotbot/plugins/regexlink.py

- defaults:
    regexlink:
      create: true
      relink: true
    link:
      create: true
      relink: true

- link:
    ~/.config/docker: docker/docker.configsymlink

- regexlink:
    '.*/(.*)\.launchagent': '~/Library/LaunchAgents/\1.plist'

- shell:
    - description: Load managed LaunchAgents
      quiet: true
      command: |
        find . -type f -name '*.launchagent' -not -path './.git/*' -print0 |
        while IFS= read -r -d '' source; do
          agent="$HOME/Library/LaunchAgents/$(basename "${source%.launchagent}").plist"
          launchctl bootout "gui/$(id -u)" "$agent" 2>/dev/null || true
          launchctl bootstrap "gui/$(id -u)" "$agent"
        done
