# Run by: ./install bootstrap
#
# Machine setup: packages, runtimes, system defaults.

- defaults:
    shell:
      # sudo is needed, so these commands need the terminal
      stdin: true
      stdout: true
      stderr: true

- shell:
    - description: Install system packages
      command: ./packages/install.sh

    - description: Apply macOS defaults
      command: if [ "$(uname -s)" = Darwin ]; then ./macos/defaults.sh; fi

    # homebrew/env.sh puts brew's tools on PATH on macOS and is a no-op on Linux
    - description: Install mise runtimes
      command: . ./homebrew/env.sh && mise install

    - description: Install agent skills
      command: . ./homebrew/env.sh && mise exec -- ./agents/install.sh

    - description: Set zsh as the default shell
      command: . ./homebrew/env.sh && ./shells/set-default.sh zsh
