version = 1

[[steps]]
plugin = 'link'
regex = true

[steps.links]
'.*/(.*)\.configsymlink' = '~/.config/\1'  # Any file/folder ending in .configsymlink goes in ~/.config
'.*/(.*)\.codexsymlink'  = '~/.codex/\1'   # Any file/folder ending in .codexsymlink goes in home directory (hidden)
'.*/(.*)\.symlink'       = '~/.\1'         # Any file/folder ending in .symlink goes in home directory (hidden)

[[steps]]
plugin = 'shell'
pre-condition = '! test -x /opt/homebrew/bin/brew'

[steps.commands]
'Installing Homebrew' = '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

[[steps]]
plugin = 'shell'

[steps.commands]
'Set macOS config' = './macos/defaults.sh'
'Install Homebrew packages' = '/opt/homebrew/bin/brew update && /opt/homebrew/bin/brew bundle --no-upgrade --file=./packages/Brewfile'
'Install Mise packages' = '/opt/homebrew/bin/mise install'
'Install agent skills' = '/opt/homebrew/bin/mise exec -- ./agents/install.sh'

[[steps]]
plugin = 'shell'
pre-condition = 'test -f ./packages/Brewfile.$(uname -n | cut -d. -f1)'

[steps.commands]
'Install device-specific Homebrew packages' = '/opt/homebrew/bin/brew bundle --no-upgrade --file=./packages/Brewfile.$(uname -n | cut -d. -f1)'

[[steps]]
plugin = 'shell'
pre-condition = '! grep xonsh /etc/shells >/dev/null 2>&1'

[steps.commands]
'Set xonsh as default shell' = 'PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH" ./xonsh/set-default.sh'
